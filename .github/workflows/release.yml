name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Unit tests
        run: dotnet test -c Release -- --filter-not-trait "Category=Integration"
      - name: Publish
        shell: pwsh
        run: |
          # The executables report the version of the tag: v0.1.0-rc.1 is 0.1.0-rc.1.
          $version = $env:GITHUB_REF_NAME.Substring(1)
          dotnet publish src/FormatKit.Cli -c Release -o artifacts -p:Version=$version
          dotnet publish src/FormatKit.App -c Release -o artifacts -p:Version=$version
      - name: SHA-256 sums
        shell: pwsh
        run: |
          $lines = foreach ($name in 'formatkit.exe', 'FormatKitUI.exe') {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath "artifacts/$name").Hash.ToLowerInvariant()
            "$hash  $name"
          }
          $path = Join-Path $PWD 'artifacts/SHA256SUMS.txt'
          [System.IO.File]::WriteAllText($path, ($lines -join "`n") + "`n", [System.Text.UTF8Encoding]::new($false))
          Get-Content -LiteralPath $path
      - name: Upload to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            artifacts/formatkit.exe
            artifacts/FormatKitUI.exe
            artifacts/SHA256SUMS.txt

  # Deploys the site from the tag ref. Needs a tag rule `v*` under Settings >
  # Environments > github-pages > Deployment branches and tags, or the deploy is rejected.
  # A prerelease skips it: the site only lists stable releases and fails the build when there are none.
  site:
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    uses: ./.github/workflows/pages.yml
    with:
      require-release: true
    permissions:
      contents: read
      pages: write
      id-token: write
